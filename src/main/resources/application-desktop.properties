# Desktop specific configuration
# This file is loaded when spring.profiles.active=desktop

# Database connection details (host, port, user, password) are loaded dynamically 
# from the JSON config file specified in --app.config.path

# Ensure the driver and dialect are set for PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Optional: You might want to update the schema if it doesn't exist locally
# spring.jpa.hibernate.ddl-auto=update
